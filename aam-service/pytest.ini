# @purpose: pytest 測試框架配置文件
# @author: DanielChung and AI
# @createdAt: 2025-11-12
# @lastModified: 2025-11-12

[pytest]
# 測試文件匹配模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 測試目錄
testpaths = tests

# 命令行選項
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --asyncio-mode=auto

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 運行時間較長的測試
    requires_db: 需要數據庫的測試
    requires_rabbitmq: 需要消息隊列的測試

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 異步測試配置
asyncio_mode = auto

